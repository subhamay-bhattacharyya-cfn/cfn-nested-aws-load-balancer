AWSTemplateFormatVersion: "2010-09-09"
Description: |
  Nested stack that creates an Application, Network, or Gateway Load Balancer with an optional listener. 
  - When CiSuffix is set, it also creates a VPC, two subnets, an internet gateway, a web security group, and a target group for CI testing.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Common Configuration"
        Parameters:
          - ProjectName
          - Environment
          - CiSuffix
      - Label:
          default: "Load Balancer Configuration"
        Parameters:
          - LoadBalancerBaseName
          - LoadBalancerType
          - Scheme
          - IpAddressType
      - Label:
          default: "Network Configuration"
        Parameters:
          - SubnetIds
          - SecurityGroupIds
      - Label:
          default: "Listener Configuration"
        Parameters:
          - ListenerProtocol
          - ListenerPort
          - DefaultTargetGroupArn
          - CertificateArn
          - SslPolicy
    ParameterLabels:
      ProjectName:
        default: "Project Name"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"
      LoadBalancerBaseName:
        default: "Load Balancer Base Name"
      LoadBalancerType:
        default: "Load Balancer Type"
      Scheme:
        default: "Scheme"
      IpAddressType:
        default: "IP Address Type"
      SubnetIds:
        default: "Subnet IDs"
      SecurityGroupIds:
        default: "Security Group IDs"
      ListenerProtocol:
        default: "Listener Protocol"
      ListenerPort:
        default: "Listener Port"
      DefaultTargetGroupArn:
        default: "Default Target Group ARN"
      CertificateArn:
        default: "Certificate ARN"
      SslPolicy:
        default: "SSL Policy"

Parameters:
  ProjectName:
    Type: String
    Default: "cfn"
    AllowedPattern: "^[a-z0-9-]{1,12}$"
  Environment:
    Type: String
    Default: devl
    AllowedValues: [devl, test, prod]
  LoadBalancerBaseName:
    Type: String
    Default: "test-alb"
    AllowedPattern: "^[a-z0-9-]{1,10}$"
    Description: Short name appended to project and environment (e.g. alb, nlb, gwlb)
  CiSuffix:
    Type: String
    Default: ""
    AllowedPattern: "^[a-z0-9-]{0,4}$"
    Description: Optional CI suffix appended to the load balancer name. Keep it short, since load balancer names are limited to 32 characters.
  LoadBalancerType:
    Type: String
    Default: application
    AllowedValues: [application, network, gateway]
  Scheme:
    Type: String
    Default: internal
    AllowedValues: [internal, internet-facing]
  SubnetIds:
    Type: CommaDelimitedList
    Default: subnet-00000000
    Description: Subnets in at least two AZs (one per AZ is required for gateway). Ignored when CiSuffix is set, because a CI build creates its own VPC and subnets. The default is a placeholder, so pass real subnets when CiSuffix is empty.
  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Leave blank for gateway load balancers, which do not support security groups
  IpAddressType:
    Type: String
    Default: ipv4
    AllowedValues: [ipv4, dualstack]

  # ---- Optional listener ----
  ListenerProtocol:
    Type: String
    Default: "HTTP"
    Description: HTTP, HTTPS (application); TCP, UDP, TCP_UDP, TLS (network); GENEVE (gateway). Blank skips the listener.
  ListenerPort:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
    Description: Port the listener accepts traffic on. Only used when ListenerProtocol is set (e.g. 443 for HTTPS, 6081 for GENEVE).
  DefaultTargetGroupArn:
    Type: String
    Default: ""
    Description: Target group the listener forwards to. Required when ListenerProtocol is set.
  CertificateArn:
    Type: String
    Default: ""
    Description: Required for HTTPS and TLS listeners only
  SslPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06

Mappings:
  TargetGroupSettings:
    application:
      Protocol: HTTP
      Port: 80
    network:
      Protocol: TCP
      Port: 80
    gateway:
      Protocol: GENEVE
      Port: 6081

Conditions:
  UsesSecurityGroups: !And
    - !Not [!Equals [!Ref LoadBalancerType, gateway]]
    - !Not [!Equals [!Join ["", !Ref SecurityGroupIds], ""]]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  UsesCiWebSecurityGroup: !And
    - !Condition HasCiSuffix
    - !Not [!Equals [!Ref LoadBalancerType, gateway]]
  HasListener: !Not [!Equals [!Ref ListenerProtocol, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  CiVpc:
    Type: AWS::EC2::VPC
    Condition: HasCiSuffix
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-${Environment}-${AWS::Region}-vpc-${CiSuffix}"

  CiSubnetA:
    Type: AWS::EC2::Subnet
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-subnet-a-${Environment}-${AWS::Region}-${CiSuffix}"

  CiSubnetB:
    Type: AWS::EC2::Subnet
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-subnet-b-${Environment}-${AWS::Region}-${CiSuffix}"

  CiInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: HasCiSuffix
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-igw-${Environment}-${AWS::Region}-${CiSuffix}"

  CiInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      InternetGatewayId: !Ref CiInternetGateway

  CiRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-rtb-${Environment}-${AWS::Region}-${CiSuffix}"

  CiDefaultRoute:
    Type: AWS::EC2::Route
    Condition: HasCiSuffix
    DependsOn: CiInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref CiRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref CiInternetGateway

  CiSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasCiSuffix
    Properties:
      SubnetId: !Ref CiSubnetA
      RouteTableId: !Ref CiRouteTable

  CiSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasCiSuffix
    Properties:
      SubnetId: !Ref CiSubnetB
      RouteTableId: !Ref CiRouteTable

  CiWebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasCiSuffix
    Properties:
      GroupDescription: Allows HTTP and HTTPS traffic to the CI load balancer
      VpcId: !Ref CiVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-web-sg-${Environment}-${AWS::Region}-${CiSuffix}"

  CiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      Protocol: !FindInMap [TargetGroupSettings, !Ref LoadBalancerType, Protocol]
      Port: !FindInMap [TargetGroupSettings, !Ref LoadBalancerType, Port]
      TargetType: instance
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${LoadBalancerBaseName}-tg-${Environment}-${AWS::Region}-${CiSuffix}"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !If
        - HasCiSuffix
        - !Sub "${ProjectName}-${LoadBalancerBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
        - !Sub "${ProjectName}-${LoadBalancerBaseName}-${Environment}-${AWS::Region}"
      Type: !Ref LoadBalancerType
      Scheme: !Ref Scheme
      Subnets: !If
        - HasCiSuffix
        - - !Ref CiSubnetA
          - !Ref CiSubnetB
        - !Ref SubnetIds
      IpAddressType: !Ref IpAddressType
      SecurityGroups: !If
        - UsesCiWebSecurityGroup
        - - !Ref CiWebSecurityGroup
        - !If [UsesSecurityGroups, !Ref SecurityGroupIds, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: !If [HasCiSuffix, !Sub "${ProjectName}-${LoadBalancerBaseName}-${Environment}-${AWS::Region}-${CiSuffix}", !Sub "${ProjectName}-${LoadBalancerBaseName}-${Environment}-${AWS::Region}"]
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: LoadBalancerType
          Value: !Ref LoadBalancerType

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasListener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ListenerPort
      Protocol: !Ref ListenerProtocol
      Certificates: !If
        - HasCertificate
        - - CertificateArn: !Ref CertificateArn
        - !Ref AWS::NoValue
      SslPolicy: !If [HasCertificate, !Ref SslPolicy, !Ref AWS::NoValue]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !If [HasCiSuffix, !Ref CiTargetGroup, !Ref DefaultTargetGroupArn]

Outputs:
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  DnsName:
    Value: !GetAtt LoadBalancer.DNSName
  CanonicalHostedZoneId:
    Description: Needed for Route 53 alias records
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  ListenerArn:
    Condition: HasListener
    Value: !Ref Listener
